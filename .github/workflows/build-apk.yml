name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate game JavaScript and mirrored assets
        run: |
          node --check game.js
          node --check app/src/main/assets/www/game.js
          cmp game.js app/src/main/assets/www/game.js
          cmp style.css app/src/main/assets/www/style.css
          grep -q 'src="three.min.js"' app/src/main/assets/www/index.html
          grep -q 'src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"' index.html

      - name: Bundle offline 3D engine
        run: curl -fsSL https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js -o app/src/main/assets/www/three.min.js

      - name: Verify bundled offline engine
        run: test -s app/src/main/assets/www/three.min.js

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Death-Note-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
